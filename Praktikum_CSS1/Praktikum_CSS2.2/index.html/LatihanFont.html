<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conton Unit em dan rem</title>
<link rel="stylesheet" href="../Latihan_font/css/LatihanFont.css">
</head>

<body>
<h1>Pengguna em dan rem</h1>
<p>Paragraf ini menggunakan ukuran font default (1rem = 16px).</p>
<div class="container">
<p>Ini berada di dalam container dengan ukuran font 1.5rem (24px).</p>
<div class="box">
Ini adalah box dengan font-size 1.2em (1.2 * 24px = 28.8px).
<p class="nested">Teks ini dalam .nested dengan font-size 1.2em (1.2 * 28.8px = 34.56px).</p>
</div>
</div>
</body>

</html>
