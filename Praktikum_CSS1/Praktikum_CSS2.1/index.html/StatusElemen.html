<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contoh :checked, :disabled, dan :empty</title>
        <link rel="stylesheet" href="../Documents/StatusElemen.css">
    </head>

    <body>
        <h2>Contoh Pseudo-Class :checked, :disabled, dan :empty</h2>
        <input type="checkbox" id="cek1">
        <label for="cek1">Centang Saya!</label>

        <br><br>
        <input type="radio" name="pilihan" id="radio1">
        <label for="radio1">Opsi 1</label>

        <input type="radio" name="pilihan" id="radio2">
        <label for="radio2">Opsi 2</label>

        <br><br>
        <input type="text" placeholder="Saya aktif">
        <input type="text" placeholder="Saya dinonaktifkan" disabled>

        <br><br>
        <div></div>
    </body>

</html>
